name: Playwright Tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v3
        with:
          node-version: 20
      - run: npm install -g pnpm@8.8.0
      - run: pnpm install
      - run: pnpm build

      - name: Install system dependencies manually
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2 \
            libnss3 \
            libxss1 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libdrm2 \
            libgbm1 \
            libgtk-3-0 \
            libxcomposite1 \
            libxdamage1 \
            libxrandr2 \
            libx11-xcb1 \
            libxcb-dri3-0 \
            libxshmfence1 \
            libffi-dev \
            libx264-dev

      - run: npx playwright install
      - run: pnpm test || exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

